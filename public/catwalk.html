<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Catwalk – Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark: #0a0a14;
      --runway-color: #1a1a2e;
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.3);
      --text-primary: #f0ece2;
      --text-secondary: #8a8a9a;
      --card-bg: rgba(20, 20, 35, 0.95);
      --card-border: rgba(201, 169, 110, 0.2);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: default;
    }

    /* Catwalk Scene */
    #catwalk-scene {
      position: relative;
      width: 100%;
      height: 100vh;
      perspective: 1200px;
      overflow: hidden;
    }

    /* Background Gradient & Lights */
    .stage-background {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(201, 169, 110, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 100%, rgba(80, 40, 120, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(40, 80, 120, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a14 0%, #12122a 50%, #0a0a14 100%);
    }

    /* Spotlight Effects */
    .spotlight {
      position: absolute;
      width: 300px;
      height: 100%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        transparent 100%);
      top: 0;
      animation: spotlightSway 8s ease-in-out infinite;
    }
    .spotlight:nth-child(1) { left: 15%; animation-delay: 0s; }
    .spotlight:nth-child(2) { left: 50%; animation-delay: -3s; }
    .spotlight:nth-child(3) { left: 75%; animation-delay: -6s; }

    @keyframes spotlightSway {
      0%, 100% { transform: skewX(-5deg); opacity: 0.5; }
      50% { transform: skewX(5deg); opacity: 1; }
    }

    /* Runway */
    .runway {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 40%;
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgba(30, 30, 50, 0.5) 20%,
          rgba(30, 30, 50, 0.8) 100%);
    }

    .runway-floor {
      position: absolute;
      bottom: 0;
      left: 10%;
      width: 80%;
      height: 60%;
      background:
        linear-gradient(180deg,
          rgba(50, 50, 80, 0.3) 0%,
          rgba(30, 30, 55, 0.6) 100%);
      transform: perspective(600px) rotateX(45deg);
      transform-origin: bottom center;
      border-top: 1px solid rgba(201, 169, 110, 0.15);
    }

    .runway-center-line {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 2px;
      height: 60%;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(201, 169, 110, 0.1) 30%,
        rgba(201, 169, 110, 0.2) 100%);
      transform: perspective(600px) rotateX(45deg) translateX(-50%);
      transform-origin: bottom center;
    }

    /* Title */
    .catwalk-title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      z-index: 10;
    }

    .catwalk-subtitle {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-secondary);
      z-index: 10;
    }

    /* Avatar Container */
    .avatar-track {
      position: absolute;
      bottom: 6%;
      left: 0;
      width: 100%;
      height: 75%;
      pointer-events: none;
    }

    .avatar-wrapper {
      position: absolute;
      bottom: 0;
      pointer-events: all;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.05);
    }

    .avatar-figure {
      position: relative;
      width: 140px;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* KI-generiertes Avatar-Bild */
    .avatar-generated-img {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
    }

    .avatar-generated-video {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
    }

    /* KI-Badge */
    .ai-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: linear-gradient(135deg, #9b59b6, #6c3483);
      color: white;
      font-size: 0.55rem;
      padding: 2px 6px;
      border-radius: 8px;
      letter-spacing: 0.05em;
      font-weight: 600;
      z-index: 5;
    }

    /* ── Fashion-Illustration SVG Silhouette ── */
    .avatar-silhouette {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .avatar-silhouette svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.3))
             drop-shadow(0 0 20px rgba(201, 169, 110, 0.08));
    }

    /* Sanftes Schwingen beim Gehen */
    .walking .avatar-silhouette {
      animation: modelSway 1.8s ease-in-out infinite;
    }
    @keyframes modelSway {
      0%, 100% { transform: rotate(-0.5deg) translateY(0); }
      25% { transform: rotate(0.3deg) translateY(-1px); }
      50% { transform: rotate(0.5deg) translateY(0); }
      75% { transform: rotate(-0.3deg) translateY(-1px); }
    }

    /* Haar-Animation */
    .walking .avatar-hair-flow {
      animation: hairFlow 2s ease-in-out infinite;
    }
    @keyframes hairFlow {
      0%, 100% { transform: skewX(0deg) translateX(0); }
      30% { transform: skewX(1.5deg) translateX(0.5px); }
      70% { transform: skewX(-1deg) translateX(-0.3px); }
    }

    /* Arm-Schwingen */
    .walking .avatar-arm-l {
      animation: armSwingL 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    .walking .avatar-arm-r {
      animation: armSwingR 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    @keyframes armSwingL {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-4deg); }
    }
    @keyframes armSwingR {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(3deg); }
    }

    /* Bein-Schwingen */
    .walking .avatar-leg-l {
      animation: legSwingL 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    .walking .avatar-leg-r {
      animation: legSwingR 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    @keyframes legSwingL {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes legSwingR {
      0%, 100% { transform: rotate(4deg); }
      50% { transform: rotate(-3deg); }
    }

    /* Hüft-Schwung */
    .walking .avatar-hips {
      animation: hipSway 0.8s ease-in-out infinite;
    }
    @keyframes hipSway {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(1px); }
    }

    /* Avatar Shadow */
    .avatar-shadow {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 14px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, transparent 70%);
    }

    /* Walk Animation */
    .avatar-walk {
      animation: avatarWalk var(--walk-duration, 20s) linear infinite;
    }

    @keyframes avatarWalk {
      0% { left: 110%; }
      100% { left: -15%; }
    }

    /* Avatar Name Label */
    .avatar-name {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    /* Outfit-Info unter dem Avatar (immer sichtbar) */
    .avatar-outfit-info {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .avatar-wrapper:hover .avatar-outfit-info {
      opacity: 1;
    }

    .avatar-outfit-brands {
      font-size: 0.6rem;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    .avatar-outfit-price {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }

    /* Product Info Card (erscheint bei Hover/Click) */
    .product-card {
      position: absolute;
      bottom: calc(100% + 20px);
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      width: 280px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
      z-index: 100;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .avatar-wrapper:hover .product-card,
    .avatar-wrapper.active .product-card {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: all;
    }

    .product-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(201, 169, 110, 0.1);
    }

    .product-card-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .product-card-total {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .product-card-items {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
    }

    .product-card-items::-webkit-scrollbar {
      width: 4px;
    }
    .product-card-items::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 2px;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 6px;
      padding: 8px 6px;
    }

    .product-item:hover {
      background: rgba(201, 169, 110, 0.08);
    }

    .product-item-info {
      flex: 1;
    }

    .product-item-category {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
    }

    .product-item-name {
      font-size: 0.85rem;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .product-item-brand {
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0.7;
    }

    .product-item-price {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-left: 12px;
      white-space: nowrap;
    }

    .product-item-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .product-item:hover .product-item-link {
      opacity: 1;
    }

    /* Shop Now Button */
    .shop-all-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), #a88a50);
      color: #0a0a14;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
    }

    .shop-all-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Loading State */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      z-index: 1000;
      transition: opacity 0.8s ease;
    }

    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent);
      letter-spacing: 0.3em;
      margin-bottom: 30px;
    }

    .loading-bar {
      width: 200px;
      height: 2px;
      background: rgba(201, 169, 110, 0.2);
      border-radius: 1px;
      overflow: hidden;
    }

    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.5s ease;
    }

    /* Empty State */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    .empty-state h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .empty-state a {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Particle effects */
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(201, 169, 110, 0.3);
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20px) rotate(720deg); opacity: 0; }
    }

    /* Date Display */
    .date-display {
      position: absolute;
      top: 30px;
      right: 30px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      z-index: 10;
    }

    /* Controls */
    .controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .control-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    /* Sprach-Dropdown */
    .lang-wrapper {
      position: relative;
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      bottom: 44px;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 0;
      min-width: 160px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .lang-wrapper.open .lang-dropdown {
      display: block;
    }

    .lang-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-primary);
      transition: background 0.2s;
      white-space: nowrap;
    }

    .lang-option:hover {
      background: rgba(201, 169, 110, 0.1);
    }

    .lang-option.active {
      color: var(--accent);
      font-weight: 600;
    }

    .lang-option .lang-flag {
      font-size: 1.1rem;
      line-height: 1;
    }

    .control-btn:hover {
      background: rgba(201, 169, 110, 0.15);
      border-color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .catwalk-title { font-size: 1.5rem; top: 15px; }
      .catwalk-subtitle { font-size: 0.7rem; top: 55px; }
      .avatar-figure { width: 100px; height: 320px; }
      .product-card { width: 240px; padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading" class="loading-screen">
    <div class="loading-text">FASHION CATWALK</div>
    <div class="loading-bar">
      <div id="loading-bar-fill" class="loading-bar-fill"></div>
    </div>
  </div>

  <!-- Catwalk Scene -->
  <div id="catwalk-scene">

    <div class="runway">
      <div class="runway-floor"></div>
      <div class="runway-center-line"></div>

    <div class="avatar-track" id="avatar-track">
      <!-- Avatare werden hier dynamisch eingefügt -->

    <div class="controls">
      <div class="lang-wrapper" id="lang-wrapper">
        <button class="control-btn" id="btn-lang" title="Language / Sprache">🌐</button>

      <button class="control-btn" id="btn-fullscreen" title="Vollbild">⛶</button>
    </div>
  </div>

    // Preis in die Landeswährung umrechnen
    function formatPrice(eurPrice) {
      const currencyCode = I18N[currentLang].currency || 'EUR';
      const curr = CURRENCY_RATES[currencyCode] || CURRENCY_RATES.EUR;
      const converted = eurPrice * curr.rate;
      // Lokales Zahlenformat
      const formatted = converted.toLocaleString(I18N[currentLang].dateLocale, {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
      return `${curr.symbol} ${formatted}`;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString(t('dateLocale'), {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    // Particles erzeugen
    function createParticles() {
      const scene = document.getElementById('catwalk-scene');
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (8 + Math.random() * 12) + 's';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.width = (1 + Math.random() * 2) + 'px';
        particle.style.height = particle.style.width;
        scene.appendChild(particle);
      }
    }

                         L34,122 C33.5,119 33.2,116 33,112
                         C32.5,100 33.5,90 35,80 Z"
                      fill="url(#skin-${index})" />
                <ellipse cx="33" cy="124" rx="2.8" ry="3.5" fill="url(#skin-${index})" />
              </g>
              <g class="avatar-arm-r">
                <path d="M82,66 C84.5,70 86,75 87,80
                         L85,80 C84.5,76 83.5,72 82,69 Z"
                      fill="${topColor}" stroke="${topDark}" stroke-width="0.3"/>
                <path d="M87,80 C88.5,90 89.5,100 89,112
                         C88.8,116 88.5,119 88,122
                         L86,122 C86.5,119 86.8,116 87,112
                         C87.5,100 86.5,90 85,80 Z"
                      fill="url(#skin-${index})" />
                <ellipse cx="87" cy="124" rx="2.8" ry="3.5" fill="url(#skin-${index})" />
              </g>
              `}

              <!-- Schuhe (elegante High Heels) -->
              <path d="M43,${shoeY} L37,${shoeY+5} C35,${shoeY+7} 38,${shoeY+9} 48,${shoeY+7} L51,${shoeY+2}" fill="${shoeColor}" />
              <path d="M77,${shoeY} L83,${shoeY+5} C85,${shoeY+7} 82,${shoeY+9} 72,${shoeY+7} L69,${shoeY+2}" fill="${shoeColor}" />
              <!-- Stiletto-Absätze -->
              <path d="M39,${shoeY+7} L38,${shoeY+14} L40,${shoeY+14} L40,${shoeY+7}" fill="${shoeDark}" />
              <path d="M81,${shoeY+7} L82,${shoeY+14} L80,${shoeY+14} L80,${shoeY+7}" fill="${shoeDark}" />

              <!-- Dezenter Lichtreflex auf Kleidung -->
              <path d="M52,62 L53,105" stroke="rgba(255,255,255,0.05)" stroke-width="6" stroke-linecap="round"/>
            </svg>
          </div>
        `;
      }

      // Outfit-Info für die Anzeige unter dem Avatar
      const outfitBrands = [...new Set(avatar.outfit.map(o => o.brand_name))];
      const outfitInfoHtml = avatar.outfit.length > 0
        ? `<div class="avatar-outfit-info">
             <div class="avatar-outfit-brands">${outfitBrands.join(' · ')}</div>
             <div class="avatar-outfit-price">${formatPrice(avatar.total_price)}</div>
           </div>`
        : '';

      wrapper.innerHTML = `
        <div class="avatar-figure">
          ${avatarBody}
          <div class="avatar-shadow"></div>
          <div class="avatar-name">${avatar.name}</div>
          ${outfitInfoHtml}
        </div>
        ${createProductCard(avatar)}
      `;

      // Click handler
      wrapper.addEventListener('click', (e) => {
        e.stopPropagation();
        // Toggle active state
        document.querySelectorAll('.avatar-wrapper.active').forEach(el => {
          if (el !== wrapper) el.classList.remove('active');
        });
        wrapper.classList.toggle('active');

        // Track hover stat
        trackStat(avatar.id, null, 'click');
      });

      // Hover stat
      wrapper.addEventListener('mouseenter', () => {
        trackStat(avatar.id, null, 'hover');
      });

      return wrapper;
    }

    // Deutsche Farbnamen → CSS Hex-Codes
    const COLOR_MAP = {
      'weiss': '#f5f5f5', 'weiß': '#f5f5f5', 'white': '#f5f5f5',
      'schwarz': '#2a2a3a', 'black': '#2a2a3a',
      'grau': '#808080', 'grey': '#808080', 'gray': '#808080',
      'rot': '#c0392b', 'red': '#c0392b',
      'blau': '#2c3e6b', 'blue': '#2c3e6b',
      'dunkelblau': '#2a3a5e', 'navy': '#2a3a5e',
      'grün': '#2d6a4f', 'green': '#2d6a4f', 'dunkelgrün': '#1b4332',
      'olive': '#606c38', 'oliv': '#606c38',
      'beige': '#d4b896', 'sand': '#d2b48c', 'creme': '#f5f0e1',
      'braun': '#6b4423', 'brown': '#6b4423', 'cognac': '#9a6324',
      'camel': '#c19a6b',
      'gold': '#c9a96e', 'roségold': '#b76e79', 'rosé': '#b76e79',
      'ivory': '#fffff0',
      'indigo': '#3f4fa3',
      'burgund': '#6b1c2a', 'bordeaux': '#6b1c2a',
      'champagner': '#f7e7ce',
      'nude': '#e8c4a2',
      'smaragd': '#2d6a4f',
      'natur': '#d4c5a9',
      'bunt': '#c9a96e',
      'gold/perle': '#c9a96e',
    };

    // Farbe in CSS-kompatiblen Hex-Wert umwandeln
    function resolveColor(colorName) {
      if (!colorName) return null;
      if (colorName.startsWith('#')) return colorName;
      return COLOR_MAP[colorName.toLowerCase()] || null;
    }

    // Outfit-Farbe für Kategorie ermitteln
    function getOutfitColor(outfit, category) {
      const item = outfit.find(o => o.category === category);
      return item && item.color ? resolveColor(item.color) : null;
    }

    // Farbe anpassen (heller/dunkler)
    function adjustColor(hex, amount) {
      if (!hex || !hex.startsWith('#')) return hex;
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
      const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
      return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // Dunkle Farben aufhellen, damit sie auf dem Bühnenhintergrund sichtbar bleiben
    function ensureVisible(hex) {
      if (!hex || !hex.startsWith('#')) return hex;
      const num = parseInt(hex.replace('#', ''), 16);
      const r = (num >> 16) & 0xFF;
      const g = (num >> 8) & 0xFF;
      const b = num & 0xFF;
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      // Wenn die Farbe zu dunkel ist (< 50), aufhellen
      if (brightness < 50) return adjustColor(hex, 55);
      if (brightness < 80) return adjustColor(hex, 30);
      return hex;
    }

    // Produkt-Karte erstellen
    function createProductCard(avatar) {
      if (!avatar.outfit || avatar.outfit.length === 0) {
        return '';
      }

      // Brands sammeln
      const brands = [...new Set(avatar.outfit.map(o => o.brand_name))];
      const brandLabel = brands.length > 1 ? brands.join(' × ') : brands[0];

      let itemsHtml = avatar.outfit.map(item => `
        <li class="product-item" data-url="${item.product_url}" data-avatar="${avatar.id}" data-article="${item.article_id}">
          <div class="product-item-info">
            <div class="product-item-category">${tCat(item.category)}</div>
            <div class="product-item-name">${item.article_name}</div>
            <div class="product-item-brand">${item.brand_name}</div>
          </div>
          <span class="product-item-price">${formatPrice(item.price)}</span>
          <span class="product-item-link">${t('shopLink')}</span>
        </li>
      `).join('');

      return `
        <div class="product-card">
          <div class="product-card-header">
            <span class="product-card-brand">${brandLabel}</span>
            <span class="product-card-total">${formatPrice(avatar.total_price)}</span>
          </div>
          <ul class="product-card-items">${itemsHtml}</ul>
          <a class="shop-all-btn" href="#" onclick="shopAll(event, '${avatar.id}')">
            ${t('shopAll')}
          </a>
        </div>
      `;
    }

    // Zum Shop weiterleiten
    function redirectToShop(url, avatarId, articleId) {
      trackStat(avatarId, articleId, 'redirect');
      window.open(url, '_blank', 'noopener');
    }

    // Ganzen Look shoppen – öffnet alle Artikel
    function shopAll(event, avatarId) {
      event.preventDefault();
      event.stopPropagation();
      const avatar = catwalkData.avatars.find(a => a.id === avatarId);
      if (!avatar) return;

      avatar.outfit.forEach((item, i) => {
        setTimeout(() => {
          redirectToShop(item.product_url, avatarId, item.article_id);
        }, i * 300);
      });
    }

    // Statistik tracken
    async function trackStat(avatarId, articleId, action) {
      try {
        await fetch(API_BASE + '/catwalk/stats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ avatar_id: avatarId, article_id: articleId, action })
        });
      } catch (e) { /* silent */ }
    }

    // Catwalk-Daten laden
    async function loadCatwalkData() {
      try {
        const res = await fetch(API_BASE + '/catwalk/show');
        catwalkData = await res.json();
        return catwalkData;
      } catch (err) {
        console.error('Fehler beim Laden:', err);
        return null;
      }
    }

    // Catwalk rendern
    function renderCatwalk() {
      const track = document.getElementById('avatar-track');
      track.innerHTML = '';

      if (!catwalkData || catwalkData.avatars.length === 0) {
        track.innerHTML = `
          <div class="empty-state">
            <h2>${t('emptyTitle')}</h2>
            <p>${t('emptyText')} <a href="/admin">${t('emptyLink')}</a></p>
          </div>
        `;
        return;
      }

      // Config + Sprache anwenden
      document.getElementById('catwalk-title').textContent = (catwalkData.config && catwalkData.config.title) || t('title');
      document.getElementById('catwalk-subtitle').textContent = t('subtitle');
      if (catwalkData.config && catwalkData.config.background_color) {
        document.documentElement.style.setProperty('--bg-dark', catwalkData.config.background_color);
      }

      // Datum anzeigen
      document.getElementById('date-display').textContent = formatDate(catwalkData.date);

      // Avatare erstellen
      catwalkData.avatars.forEach((avatar, index) => {
        const el = createAvatarElement(avatar, index);
        track.appendChild(el);
      });

      // Klick-Handler für Produkt-Items
      document.querySelectorAll('.product-item[data-url]').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          redirectToShop(item.dataset.url, item.dataset.avatar, item.dataset.article);
        });
      });
    }

    // Sprach-Dropdown
    function updateLangUI() {
      // Aktive Sprache markieren
      document.querySelectorAll('.lang-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.lang === currentLang);
      });
      // Button zeigt Flagge der aktuellen Sprache
      document.getElementById('btn-lang').textContent = I18N[currentLang].flag;
      document.getElementById('btn-lang').title = 'Language / Sprache';
    }
    updateLangUI();

    // Dropdown öffnen/schließen
    document.getElementById('btn-lang').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('lang-wrapper').classList.toggle('open');
    });

    // Sprache wählen
    document.querySelectorAll('.lang-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        currentLang = opt.dataset.lang;
        localStorage.setItem('catwalk-lang', currentLang);
        document.getElementById('lang-wrapper').classList.remove('open');
        updateLangUI();
        renderCatwalk();
      });
    });

    // Dropdown schließen bei Klick außerhalb
    document.addEventListener('click', () => {
      document.getElementById('lang-wrapper').classList.remove('open');
    });

    // Controls
    document.getElementById('btn-pause').addEventListener('click', () => {
      isPaused = !isPaused;
      document.querySelectorAll('.avatar-walk').forEach(el => {
        el.style.animationPlayState = isPaused ? 'paused' : 'running';
      });
    });

    document.getElementById('btn-speed').addEventListener('click', () => {
      const speeds = [0.5, 1, 1.5, 2];
      const currentIdx = speeds.indexOf(speedMultiplier);
      speedMultiplier = speeds[(currentIdx + 1) % speeds.length];
      document.querySelectorAll('.avatar-walk').forEach(el => {
        const currentDuration = parseFloat(el.style.getPropertyValue('--walk-duration'));
        el.style.setProperty('--walk-duration', (currentDuration / speedMultiplier) + 's');
      });
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.getElementById('catwalk-scene').requestFullscreen();
      }
    });

    // Klick auf Szene schließt aktive Karten
    document.getElementById('catwalk-scene').addEventListener('click', () => {
      document.querySelectorAll('.avatar-wrapper.active').forEach(el => {
        el.classList.remove('active');
      });
    });

    // Initialisierung
    async function init() {
      const loadingBar = document.getElementById('loading-bar-fill');
      loadingBar.style.width = '30%';

      createParticles();
      loadingBar.style.width = '50%';

      await loadCatwalkData();
      loadingBar.style.width = '80%';

      renderCatwalk();
      loadingBar.style.width = '100%';

      // Loading ausblenden
      setTimeout(() => {
        document.getElementById('loading').classList.add('fade-out');
        setTimeout(() => {
          document.getElementById('loading').remove();
        }, 800);
      }, 500);

      // Auto-Refresh alle 5 Minuten
      setInterval(async () => {
        await loadCatwalkData();
        renderCatwalk();
      }, 5 * 60 * 1000);
    }

    init();
  </script>

    <span style="color:#555;">|</span>
