<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Catwalk – Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark: #0a0a14;
      --runway-color: #1a1a2e;
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.3);
      --text-primary: #f0ece2;
      --text-secondary: #8a8a9a;
      --card-bg: rgba(20, 20, 35, 0.95);
      --card-border: rgba(201, 169, 110, 0.2);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: default;
      user-select: none;
    }

    /* ═══════════════════════════════════════ */
    /*  BÜHNE & LAUFSTEG                      */
    /* ═══════════════════════════════════════ */
    #catwalk-scene {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .stage-background {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 10%, rgba(201, 169, 110, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 30% 90%, rgba(80, 40, 120, 0.08) 0%, transparent 40%),
        radial-gradient(ellipse at 70% 90%, rgba(40, 80, 120, 0.08) 0%, transparent 40%),
        linear-gradient(180deg, #08081a 0%, #0e0e24 40%, #0a0a14 100%);
    }

    /* Laufsteg-Boden (Perspektive: schmal hinten, breit vorne) */
    .runway-floor {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 85%;
      clip-path: polygon(38% 0%, 62% 0%, 92% 100%, 8% 100%);
      background:
        linear-gradient(180deg,
          rgba(25, 25, 45, 0.6) 0%,
          rgba(30, 30, 55, 0.7) 40%,
          rgba(35, 35, 60, 0.8) 70%,
          rgba(40, 40, 70, 0.9) 100%);
    }

    /* Laufsteg-Glanzstreifen (Mitte) */
    .runway-center-shine {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 85%;
      clip-path: polygon(48% 0%, 52% 0%, 55% 100%, 45% 100%);
      background:
        linear-gradient(180deg,
          rgba(201, 169, 110, 0.02) 0%,
          rgba(201, 169, 110, 0.04) 50%,
          rgba(201, 169, 110, 0.06) 100%);
      pointer-events: none;
    }

    /* Laufsteg-Ränder (links + rechts, perspektivisch) */
    .runway-edge {
      position: absolute;
      top: 15%;
      height: 85%;
      width: 2px;
      pointer-events: none;
    }
    .runway-edge-left {
      left: 38%;
      background: linear-gradient(180deg, rgba(201,169,110,0.05) 0%, rgba(201,169,110,0.15) 100%);
      transform-origin: top center;
      /* Perspektivische Neigung: oben bei 38%, unten bei 8% */
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }
    .runway-edge-right {
      right: 38%;
      background: linear-gradient(180deg, rgba(201,169,110,0.05) 0%, rgba(201,169,110,0.15) 100%);
    }

    /* Perspektiv-Linien auf dem Boden */
    .runway-lines {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 85%;
      pointer-events: none;
      overflow: hidden;
    }
    .runway-line {
      position: absolute;
      left: 50%;
      width: 1px;
      background: rgba(201, 169, 110, 0.04);
    }

    /* Spotlights von oben */
    .spotlight {
      position: absolute;
      top: 0;
      width: 300px;
      height: 80%;
      pointer-events: none;
      animation: spotlightSway 8s ease-in-out infinite;
    }
    .spotlight:nth-child(1) {
      left: 25%;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 70%);
      animation-delay: 0s;
    }
    .spotlight:nth-child(2) {
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 55%);
      animation-delay: -2.5s;
    }
    .spotlight:nth-child(3) {
      right: 25%;
      left: auto;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 70%);
      animation-delay: -5s;
    }

    @keyframes spotlightSway {
      0%, 100% { transform: skewX(-3deg); opacity: 0.6; }
      50% { transform: skewX(3deg); opacity: 1; }
    }

    /* ═══════════════════════════════════════ */
    /*  PUBLIKUM-SILHOUETTEN                  */
    /* ═══════════════════════════════════════ */
    .audience {
      position: absolute;
      bottom: 0;
      height: 50%;
      width: 18%;
      z-index: 60;
      pointer-events: none;
    }
    .audience-left { left: 0; }
    .audience-right { right: 0; }
    .audience svg { width: 100%; height: 100%; opacity: 0.55; }

    /* ═══════════════════════════════════════ */
    /*  KAMERA-BLITZLICHT                     */
    /* ═══════════════════════════════════════ */
    .camera-flash {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0.5) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 65;
      opacity: 0;
    }

    @keyframes flashBurst {
      0% { opacity: 0; transform: scale(0.5); }
      8% { opacity: 1; transform: scale(4); }
      20% { opacity: 0.8; transform: scale(2.5); }
      40% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 0; }
    }

    .flash-ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      background: radial-gradient(ellipse at var(--fx, 50%) var(--fy, 80%), rgba(255,255,255,0.04) 0%, transparent 40%);
      transition: opacity 0.05s;
    }

    /* Laufsteg-Rand-Lichter (am Boden, unten) */
    .runway-edge-lights {
      position: absolute;
      bottom: 3%;
      left: 8%;
      width: 84%;
      display: flex;
      justify-content: space-around;
      z-index: 4;
      pointer-events: none;
    }
    .edge-light {
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.25;
      box-shadow: 0 0 8px var(--accent-glow);
      animation: edgePulse 3s ease-in-out infinite;
    }
    .edge-light:nth-child(odd) { animation-delay: -1.5s; }
    @keyframes edgePulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.4; }
    }

    /* ═══════════════════════════════════════ */
    /*  TITEL & UI                            */
    /* ═══════════════════════════════════════ */
    .catwalk-title {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      z-index: 70;
      white-space: nowrap;
    }

    .catwalk-subtitle {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-secondary);
      z-index: 70;
      white-space: nowrap;
    }

    .date-display {
      position: absolute;
      top: 26px;
      right: 24px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 70;
    }

    .avatar-counter {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      z-index: 70;
      opacity: 0.6;
    }
    .avatar-counter span { color: var(--accent); font-weight: 600; }

    /* ═══════════════════════════════════════ */
    /*  AVATAR AUF DEM LAUFSTEG              */
    /* ═══════════════════════════════════════ */
    .avatar-track {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .avatar-wrapper {
      position: absolute;
      pointer-events: all;
      cursor: pointer;
      transform-origin: center bottom;
      will-change: transform, top, opacity;
    }

    .avatar-figure {
      position: relative;
      width: 140px;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Walking-Animationen */
    .walking .avatar-silhouette {
      animation: modelSway 1.6s ease-in-out infinite;
    }
    @keyframes modelSway {
      0%, 100% { transform: rotate(-0.4deg) translateY(0); }
      25% { transform: rotate(0.25deg) translateY(-1px); }
      50% { transform: rotate(0.4deg) translateY(0); }
      75% { transform: rotate(-0.25deg) translateY(-1px); }
    }

    .walking .avatar-hair-flow {
      animation: hairFlow 2s ease-in-out infinite;
    }
    @keyframes hairFlow {
      0%, 100% { transform: skewX(0deg); }
      30% { transform: skewX(1.5deg); }
      70% { transform: skewX(-1deg); }
    }

    .walking .avatar-arm-l {
      animation: armSwingL 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    .walking .avatar-arm-r {
      animation: armSwingR 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    @keyframes armSwingL {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-4deg); }
    }
    @keyframes armSwingR {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(3deg); }
    }

    .walking .avatar-leg-l {
      animation: legSwingL 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    .walking .avatar-leg-r {
      animation: legSwingR 0.8s ease-in-out infinite;
      transform-origin: 50% 0%;
    }
    @keyframes legSwingL {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes legSwingR {
      0%, 100% { transform: rotate(4deg); }
      50% { transform: rotate(-3deg); }
    }

    .walking .avatar-hips {
      animation: hipSway 0.8s ease-in-out infinite;
    }
    @keyframes hipSway {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(1px); }
    }

    /* Pose-Animation (am vorderen Ende) */
    .posing .avatar-silhouette {
      animation: poseStance 3s ease-in-out;
    }
    @keyframes poseStance {
      0% { transform: rotate(0); }
      15% { transform: rotate(-2deg) translateX(-2px); }
      30% { transform: rotate(0); }
      50% { transform: rotate(1.5deg) translateX(1px); }
      70% { transform: rotate(0); }
      100% { transform: rotate(0); }
    }

    /* Umdreh-Animation */
    .turning .avatar-figure {
      animation: turnAround 0.6s ease-in-out;
    }
    @keyframes turnAround {
      0% { transform: scaleX(1) perspective(400px) rotateY(0deg); }
      50% { transform: scaleX(0.1) perspective(400px) rotateY(90deg); }
      100% { transform: scaleX(1) perspective(400px) rotateY(0deg); }
    }

    /* Schatten unter dem Avatar */
    .avatar-shadow {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 12px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.3) 0%, transparent 70%);
    }

    /* Avatar-Name */
    .avatar-name {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* Name erst anzeigen wenn Avatar vorne ist */
    .avatar-wrapper.show-name .avatar-name {
      opacity: 1;
    }

    /* Outfit-Info */
    .avatar-outfit-info {
      position: absolute;
      bottom: -52px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .avatar-wrapper.show-name .avatar-outfit-info {
      opacity: 0.85;
    }
    .avatar-outfit-brands {
      font-size: 0.58rem;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }
    .avatar-outfit-price {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }

    /* ═══════════════════════════════════════ */
    /*  KI-GENERIERTE BILDER/VIDEOS          */
    /*  IMMERSIVE DARSTELLUNG                */
    /* ═══════════════════════════════════════ */
    .avatar-generated-img {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      height: 100%; width: auto; max-width: 200px;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
    }
    .avatar-generated-video {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      height: 100%; width: auto;
      object-fit: contain;
      border-radius: 0;
      filter: none;
      /* ★ DER TRICK: mix-blend-mode: lighten
         → Dunkle Pixel (Video-Hintergrund) werden UNSICHTBAR
         → Helle Pixel (das beleuchtete Model) bleiben sichtbar
         → Kein Rahmen, kein Kästchen — Model läuft FREI auf der Bühne!
         Funktioniert weil das Video dunklen Runway-Hintergrund hat
         und unsere Seite auch dunkel ist. */
      mix-blend-mode: lighten;
      transition: transform 0.5s ease;
    }
    /* Video-Avatare: groß & immersiv — wie eine echte Fashion Show */
    .avatar-wrapper.has-video .avatar-figure {
      width: 50vw;
      max-width: 520px;
      height: 78vh;
      max-height: 820px;
    }
    .avatar-wrapper.has-video .avatar-shadow {
      width: 40%;
      height: 16px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
    }
    /* Kein AI-Badge bei Videos — soll natürlich aussehen */
    .avatar-wrapper.has-video .ai-badge {
      display: none;
    }
    /* Rücklauf: Video spiegeln (Model läuft mit dem Rücken zu uns) */
    .avatar-wrapper.returning .avatar-generated-video {
      transform: translateX(-50%) scaleX(-1);
    }
    /* Keine CSS-Walk-Animationen bei Video (Video hat eigene Bewegung) */
    .avatar-wrapper.has-video.walking .avatar-generated-video,
    .avatar-wrapper.has-video.posing .avatar-generated-video,
    .avatar-wrapper.has-video.turning .avatar-generated-video {
      animation: none;
    }
    .ai-badge {
      position: absolute; top: -8px; right: -8px;
      background: linear-gradient(135deg, #9b59b6, #6c3483);
      color: white; font-size: 0.55rem; padding: 2px 6px;
      border-radius: 8px; letter-spacing: 0.05em; font-weight: 600; z-index: 5;
    }

    .avatar-silhouette {
      position: relative; width: 100%; height: 100%;
    }
    .avatar-silhouette svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.3))
             drop-shadow(0 0 20px rgba(201,169,110,0.06));
    }

    /* ═══════════════════════════════════════ */
    /*  PRODUKT-KARTE (bei Klick vorne)       */
    /* ═══════════════════════════════════════ */
    .product-card {
      position: absolute;
      bottom: calc(100% + 15px);
      left: 50%;
      transform: translateX(-50%) scale(0.85) translateY(10px);
      width: 290px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
      z-index: 200;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(201,169,110,0.04);
    }

    .avatar-wrapper.stopped .product-card {
      opacity: 1;
      transform: translateX(-50%) scale(1) translateY(0);
      pointer-events: all;
    }

    .product-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(201,169,110,0.1);
    }
    .product-card-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1rem; font-weight: 700; color: var(--accent);
    }
    .product-card-total {
      font-size: 1.1rem; font-weight: 600; color: var(--text-primary);
    }
    .product-card-items {
      list-style: none; max-height: 220px; overflow-y: auto;
    }
    .product-card-items::-webkit-scrollbar { width: 4px; }
    .product-card-items::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }
    .product-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer; transition: background 0.2s; border-radius: 6px;
    }
    .product-item:hover { background: rgba(201,169,110,0.08); }
    .product-item-info { flex: 1; }
    .product-item-category {
      font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-secondary);
    }
    .product-item-name { font-size: 0.85rem; color: var(--text-primary); margin-top: 2px; }
    .product-item-brand { font-size: 0.7rem; color: var(--accent); opacity: 0.7; }
    .product-item-price {
      font-size: 0.9rem; font-weight: 600; color: var(--text-primary);
      margin-left: 12px; white-space: nowrap;
    }
    .product-item-link {
      display: inline-flex; align-items: center; gap: 4px;
      margin-left: 8px; font-size: 0.7rem; color: var(--accent);
      opacity: 0; transition: opacity 0.2s;
    }
    .product-item:hover .product-item-link { opacity: 1; }

    .free-shipping-badge {
      display: flex; align-items: center; justify-content: center;
      gap: 4px; margin-top: 8px; padding: 5px 0;
      font-size: 0.68rem; color: #4ade80; letter-spacing: 0.05em; opacity: 0.8;
    }
    .shop-all-btn {
      display: block; width: 100%; margin-top: 8px; padding: 11px;
      background: linear-gradient(135deg, var(--accent), #a88a50);
      color: #0a0a14; border: none; border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: 0.8rem;
      font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none;
    }
    .shop-all-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Hinweis: "Klicke zum Ansehen" */
    .click-hint {
      position: absolute;
      bottom: -70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
      animation: hintPulse 2s ease-in-out infinite;
    }
    .avatar-wrapper.show-name:not(.stopped) .click-hint {
      opacity: 0.7;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    /* ═══════════════════════════════════════ */
    /*  LOADING                               */
    /* ═══════════════════════════════════════ */
    .loading-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg-dark); z-index: 1000; transition: opacity 0.8s ease;
    }
    .loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .loading-text {
      font-family: 'Playfair Display', serif; font-size: 2rem;
      color: var(--accent); letter-spacing: 0.3em; margin-bottom: 30px;
    }
    .loading-bar { width: 200px; height: 2px; background: rgba(201,169,110,0.2); border-radius: 1px; overflow: hidden; }
    .loading-bar-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.5s ease; }

    /* Empty State */
    .empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; z-index: 10;
    }
    .empty-state h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--accent); margin-bottom: 10px; }
    .empty-state p { color: var(--text-secondary); font-size: 0.9rem; }
    .empty-state a { color: var(--accent); text-decoration: underline; }

    /* Partikel */
    .particle {
      position: absolute; width: 2px; height: 2px;
      background: rgba(201,169,110,0.3); border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20px) rotate(720deg); opacity: 0; }
    }

    /* ═══════════════════════════════════════ */
    /*  CONTROLS                              */
    /* ═══════════════════════════════════════ */
    .controls {
      position: absolute; bottom: 16px; right: 16px;
      display: flex; gap: 8px; z-index: 70;
    }
    .control-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; transition: all 0.2s;
    }
    .control-btn:hover { background: rgba(201,169,110,0.15); border-color: var(--accent); }
    .control-btn.active { background: rgba(201,169,110,0.2); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

    .lang-wrapper { position: relative; }
    .lang-dropdown {
      display: none; position: absolute; bottom: 44px; right: 0;
      background: var(--card-bg); border: 1px solid var(--card-border);

      backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .lang-wrapper.open .lang-dropdown { display: block; }
    .lang-option {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px;
      cursor: pointer; font-size: 0.8rem; color: var(--text-primary);
      transition: background 0.2s; white-space: nowrap;

    .lang-option.active { color: var(--accent); font-weight: 600; }
    .lang-option .lang-flag { font-size: 1.1rem; line-height: 1; }

    /* ═══════════════════════════════════════ */
    /*  FULLSCREEN FASHION SHOW (Video-Modus) */
    /*  Wie eine echte Fashion Show:          */
    /*  Ein Model nach dem anderen,           */
    /*  bildschirmfüllend, mit Überblendung   */
    /* ═══════════════════════════════════════ */
    .fs-show {
      position: absolute;
      inset: 0;
      z-index: 50;
      overflow: hidden;
      background: #000;
    }

    /* Gradient-Overlay unten für Textlesbarkeit */
    .fs-show::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 51;
    }

    /* Videos: bildschirmfüllend mit Platz für Titel oben */
    .fs-video {
      position: absolute;
      top: 60px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100% - 60px);
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 1;
    }
    .fs-video.active { opacity: 1; }

    /* Bild-Fallback (Ken Burns Zoom-Effekt) */
    .fs-image {
      position: absolute;
      top: 60px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100% - 60px);
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 1;
    }
    .fs-image.active {
      opacity: 1;
      animation: kenBurns 12s ease-in-out infinite;
    }
    @keyframes kenBurns {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.06) translateY(-1%); }
    }

    /* Model-Info Overlay (Name, Marken, Preis) */
    .fs-overlay {
      position: absolute;
      bottom: 50px;
      left: 0; right: 0;
      text-align: center;
      z-index: 55;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
    }
    .fs-overlay.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .fs-model-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6);
      margin-bottom: 4px;
    }
    .fs-model-brands {
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-shadow: 0 1px 10px rgba(0,0,0,0.9);
    }
    .fs-model-price {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 4px;
      text-shadow: 0 1px 10px rgba(0,0,0,0.9);
    }
    .fs-click-hint {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 14px;
      letter-spacing: 0.12em;
      opacity: 0.6;
      animation: hintPulse 2s ease-in-out infinite;
    }

    /* Produkt-Panel (gleitet von unten hoch bei Klick) */
    .fs-product-panel {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 90%; max-width: 420px;
      max-height: 70vh;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px 18px 0 0;
      padding: 24px;
      z-index: 62;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      overflow-y: auto;
    }
    .fs-product-panel.open {
      transform: translateX(-50%) translateY(0);
    }
    .fs-panel-handle {
      width: 40px; height: 4px;
      background: var(--card-border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    /* Dimmer hinter dem Produkt-Panel */
    .fs-dimmer {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      z-index: 58;
    }
    .fs-dimmer.active { opacity: 1; pointer-events: all; }

    /* Progress-Dots */
    .fs-dots {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px;
      z-index: 55;
    }
    .fs-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .fs-dot.active {
      background: var(--accent);
      width: 24px;
      border-radius: 4px;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Navigation-Pfeile */
    .fs-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      font-size: 3rem;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      z-index: 55;
      padding: 20px;
      transition: color 0.3s;
      user-select: none;
    }
    .fs-nav:hover { color: var(--accent); }
    .fs-nav-prev { left: 10px; }
    .fs-nav-next { right: 10px; }

    /* ═══════════════════════════════════════ */
    /*  RESPONSIVE                            */
    /* ═══════════════════════════════════════ */
    @media (max-width: 768px) {
      .catwalk-title { font-size: 1.1rem; top: 8px; letter-spacing: 0.12em; }
      .catwalk-subtitle { font-size: 0.55rem; top: 32px; }
      .fs-video, .fs-image { top: 45px; height: calc(100% - 45px); }
      .avatar-figure { width: 100px; height: 340px; }

      .fs-model-price { font-size: 0.9rem; }

    const COLOR_MAP = {
      'weiss': '#f5f5f5', 'weiß': '#f5f5f5', 'white': '#f5f5f5',
      'schwarz': '#2a2a3a', 'black': '#2a2a3a',

      'gold': '#c9a96e', 'roségold': '#b76e79', 'rosé': '#b76e79',
      'ivory': '#fffff0', 'indigo': '#3f4fa3',
      'burgund': '#6b1c2a', 'bordeaux': '#6b1c2a', 'champagner': '#f7e7ce',
      'nude': '#e8c4a2', 'smaragd': '#2d6a4f', 'natur': '#d4c5a9',
      'bunt': '#c9a96e', 'gold/perle': '#c9a96e',
    };

    function resolveColor(n) { return !n ? null : n.startsWith('#') ? n : COLOR_MAP[n.toLowerCase()] || null; }
    function getOutfitColor(outfit, cat) { const i = outfit.find(o => o.category === cat); return i?.color ? resolveColor(i.color) : null; }

    function adjustColor(hex, amt) {
      if (!hex?.startsWith('#')) return hex;
      const n = parseInt(hex.replace('#',''), 16);
      const r = Math.min(255, Math.max(0, (n >> 16) + amt));
      const g = Math.min(255, Math.max(0, ((n >> 8) & 0xFF) + amt));
      const b = Math.min(255, Math.max(0, (n & 0xFF) + amt));
      return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function ensureVisible(hex) {
      if (!hex?.startsWith('#')) return hex;
      const n = parseInt(hex.replace('#',''), 16);
      const br = ((n>>16&0xFF)*299 + (n>>8&0xFF)*587 + (n&0xFF)*114) / 1000;
      return br < 50 ? adjustColor(hex, 55) : br < 80 ? adjustColor(hex, 30) : hex;
    }

    function ensureSkinContrast(cHex, sHex) {
      if (!cHex?.startsWith('#') || !sHex?.startsWith('#')) return cHex;
      const c = parseInt(cHex.replace('#',''),16), s = parseInt(sHex.replace('#',''),16);
      const cr=(c>>16)&0xFF, cg=(c>>8)&0xFF, cb=c&0xFF;
      const sr=(s>>16)&0xFF, sg=(s>>8)&0xFF, sb=s&0xFF;
      const dist = Math.abs(cr-sr)+Math.abs(cg-sg)+Math.abs(cb-sb);
      if (dist >= 190) return cHex;
      const cL = (cr*299+cg*587+cb*114)/1000, sL = (sr*299+sg*587+sb*114)/1000;
      const amt = dist < 100 ? 65 : 50;
      if (cL >= sL) return cL < 220 ? adjustColor(cHex, amt) : adjustColor(cHex, -(amt+25));
      return cL > 50 ? adjustColor(cHex, -amt) : adjustColor(cHex, amt+25);
    }

    function createProductCard(avatar) {
      if (!avatar.outfit?.length) return '';
      const brands = [...new Set(avatar.outfit.map(o => o.brand_name))];
      const brandLabel = brands.length > 1 ? brands.join(' × ') : brands[0];
      const items = avatar.outfit.map(i => `
        <li class="product-item" data-url="${i.product_url}" data-avatar="${avatar.id}" data-article="${i.article_id}">
          <div class="product-item-info">
            <div class="product-item-category">${tCat(i.category)}</div>
            <div class="product-item-name">${i.article_name}</div>
            <div class="product-item-brand">${i.brand_name}</div>
          </div>
          <span class="product-item-price">${formatPrice(i.price)}</span>
          <span class="product-item-link">${t('shopLink')}</span>
        </li>`).join('');

      return `<div class="product-card">
        <div class="product-card-header">
          <span class="product-card-brand">${brandLabel}</span>
          <span class="product-card-total">${formatPrice(avatar.total_price)}</span>
        </div>
        <ul class="product-card-items">${items}</ul>
        <div class="free-shipping-badge">${t('freeShipping')}</div>
        <a class="shop-all-btn" href="#" onclick="shopAll(event,'${avatar.id}')">${t('shopAll')}</a>
      </div>`;
    }

    // ═══════════════════════════════════════════════════════
    //  LAUFSTEG-ANIMATION (Hin- und Rücklauf)
    // ═══════════════════════════════════════════════════════

    // Zustände: 'approaching', 'posing', 'turning', 'returning', 'offstage', 'stopped'
    class WalkingAvatar {
      constructor(avatarData, element, index) {
        this.data = avatarData;
        this.el = element;
        this.index = index;
        this.state = 'offstage';
        this.progress = 0;      // 0 = hinten, 1 = vorne
        this.stateTimer = 0;
        this.videoEl = element.querySelector('.avatar-generated-video');
        this.hasVideo = !!this.videoEl;
        // Video-Avatare laufen immer mittig, SVG-Avatare leicht versetzt
        this.xOffset = this.hasVideo ? 0 : (index % 3 - 1) * 3;
      }

      start() {
        this.state = 'approaching';
        this.progress = 0;
        this.stateTimer = 0;
        this.el.classList.add('walking');
        this.el.classList.remove('posing', 'turning', 'stopped', 'show-name', 'returning');
        // Video abspielen wenn vorhanden
        if (this.videoEl) {
          this.videoEl.currentTime = 0;
          this.videoEl.play().catch(() => {});
        }
        this.updateVisual();
      }

      update(dt) {
        if (isPaused || this.state === 'offstage' || this.state === 'stopped') return;

        const spd = speedMultiplier;
        const cfg = WALK_CONFIG;

        switch (this.state) {
          case 'approaching':
            this.progress += (dt / cfg.approachMs) * spd;
            if (this.progress >= 1) {
              this.progress = 1;
              this.state = 'posing';
              this.stateTimer = 0;
              this.el.classList.remove('walking');
              this.el.classList.add('posing', 'show-name');
              // Video pausieren bei Pose
              if (this.videoEl) this.videoEl.pause();
            }
            break;

          case 'posing':
            this.stateTimer += dt * spd;
            if (this.stateTimer >= cfg.poseMs) {
              this.state = 'turning';
              this.stateTimer = 0;
              this.el.classList.remove('posing');
              this.el.classList.add('turning');
            }
            break;

          case 'turning':
            this.stateTimer += dt * spd;
            if (this.stateTimer >= cfg.turnMs) {
              this.state = 'returning';
              this.stateTimer = 0;
              this.el.classList.remove('turning', 'show-name');
              this.el.classList.add('walking', 'returning');
              // Video wieder abspielen beim Zurücklaufen (gespiegelt = Rücken zu uns)
              if (this.videoEl) this.videoEl.play().catch(() => {});
            }
            break;

          case 'returning':
            this.progress -= (dt / cfg.returnMs) * spd;
            if (this.progress <= 0) {
              this.progress = 0;
              this.state = 'offstage';
              this.el.classList.remove('walking', 'returning');
              this.el.style.opacity = '0';
              // Video stoppen
              if (this.videoEl) { this.videoEl.pause(); this.videoEl.currentTime = 0; }
              // Zurück in die Warteschlange
              walkerQueue.push(this);
            }
            break;
        }

        this.updateVisual();
      }

      updateVisual() {
        const cfg = WALK_CONFIG;
        const p = this.progress;

        // Easing: langsamer ankommen (ease-out), schneller weggehen
        const easedP = this.state === 'returning' ? p : easeOutCubic(p);

        const y = lerp(cfg.backY, cfg.frontY, easedP);
        const scale = lerp(cfg.backScale, cfg.frontScale, easedP);
        const brightness = lerp(cfg.backBrightness, cfg.frontBrightness, easedP);

        // ★ ZWEI BAHNEN wie echte Fashion Show:
        //   Hinlauf:  RECHTE Seite (approachX → centerX)
        //   Pose:     MITTE (centerX)
        //   Rücklauf: LINKE Seite (centerX → returnX)
        //   So kommen sich die Models nicht in die Quere!
        let x;
        if (this.state === 'returning') {
          // Rücklauf: von Mitte nach links hinten
          x = lerp(cfg.returnX, cfg.centerX, easedP);
        } else if (this.state === 'posing' || this.state === 'turning' || this.state === 'stopped') {
          // Vorne in der Mitte posieren
          x = cfg.centerX;
        } else {
          // Hinlauf: von rechts hinten zur Mitte
          x = lerp(cfg.approachX, cfg.centerX, easedP);
        }

        this.el.style.top = y + '%';
        this.el.style.left = x + '%';
        this.el.style.transform = `translate(-50%, -100%) scale(${scale.toFixed(3)})`;
        this.el.style.zIndex = Math.floor(p * 50) + 5;

        // Video-Avatare: KEIN Filter auf Wrapper (damit mix-blend-mode funktioniert)
        // SVG-Avatare: Helligkeit für Tiefenwirkung
        if (this.hasVideo) {
          this.el.style.filter = 'none';
        } else {
          this.el.style.filter = `brightness(${brightness.toFixed(2)})`;
        }

        // Sanftes Einblenden beim Start
        if (this.state !== 'offstage') {
          this.el.style.opacity = p < 0.08 ? (p / 0.08).toFixed(2) : '1';
        }
      }

      stop() {
        this.state = 'stopped';
        this.el.classList.remove('walking', 'posing', 'turning', 'returning');
        this.el.classList.add('stopped', 'show-name');
        // Video pausieren
        if (this.videoEl) this.videoEl.pause();
        trackStat(this.data.id, null, 'click');
      }

      resume() {
        this.el.classList.remove('stopped');
        this.state = 'turning';
        this.stateTimer = 0;
        this.el.classList.add('turning');
        // Video wieder abspielen
        if (this.videoEl) this.videoEl.play().catch(() => {});
      }
    }

    function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function handleAvatarClick(wrapperEl) {
      const walker = activeWalkers.find(w => w.el === wrapperEl);
      if (!walker) return;

      if (walker.state === 'stopped') {
        // Zweiter Klick → weiterlaufen
        walker.resume();
      } else if (walker.state === 'posing' || (walker.state === 'approaching' && walker.progress > 0.7)) {
        // Am vorderen Ende → anhalten und Produkte zeigen
        walker.progress = 1;
        walker.updateVisual();
        walker.stop();
      }
    }

    // Haupt-Animations-Loop
    function animationLoop(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      const dt = Math.min(timestamp - lastFrameTime, 100); // Max 100ms delta (kein Sprung bei Tab-Wechsel)
      lastFrameTime = timestamp;

      activeWalkers.forEach(w => w.update(dt));

      animFrameId = requestAnimationFrame(animationLoop);
    }

    // Avatar-Spawn-System
    function spawnNextAvatar() {
      if (walkerQueue.length === 0) return;

      const walker = walkerQueue.shift();
      walker.start();

      // Nächsten Avatar nach Stagger-Delay spawnen
      const delay = WALK_CONFIG.staggerMs / speedMultiplier;
      spawnTimer = setTimeout(spawnNextAvatar, delay);
    }

    // ═══════════════════════════════════════════════════════
    //  KAMERA-BLITZLICHTER
    // ═══════════════════════════════════════════════════════
    function triggerCameraFlash() {
      if (!flashesEnabled || isPaused) return;
      const scene = document.getElementById('catwalk-scene');
      const ambient = document.getElementById('flash-ambient');

      const side = Math.random() > 0.5 ? 'left' : 'right';
      const x = side === 'left' ? (3 + Math.random() * 13) : (84 + Math.random() * 13);
      const y = 55 + Math.random() * 30;

      const flash = document.createElement('div');
      flash.className = 'camera-flash';
      flash.style.left = x + '%';
      flash.style.top = y + '%';
      flash.style.animation = 'flashBurst 0.5s ease-out forwards';
      scene.appendChild(flash);

      ambient.style.setProperty('--fx', x + '%');
      ambient.style.setProperty('--fy', y + '%');
      ambient.style.opacity = '1';
      setTimeout(() => { ambient.style.opacity = '0'; }, 80);
      setTimeout(() => flash.remove(), 600);
    }

    function startFlashes() {
      function schedule() {
        flashTimeout = setTimeout(() => {
          triggerCameraFlash();
          if (Math.random() > 0.7) setTimeout(triggerCameraFlash, 150);
          schedule();
        }, 2000 + Math.random() * 4000);
      }
      schedule();
    }

    function stopFlashes() {
      if (flashTimeout) { clearTimeout(flashTimeout); flashTimeout = null; }
    }

    // ═══════════════════════════════════════════════════════
    //  VISUELLE ELEMENTE
    // ═══════════════════════════════════════════════════════
    function createParticles() {
      const scene = document.getElementById('catwalk-scene');
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = Math.random() * 10 + 's';
        const s = (1 + Math.random() * 2) + 'px';
        p.style.width = s; p.style.height = s;
        scene.appendChild(p);
      }
    }

    function createEdgeLights() {
      const c = document.getElementById('edge-lights');
      for (let i = 0; i < 20; i++) {
        const l = document.createElement('div');
        l.className = 'edge-light';
        l.style.animationDelay = (Math.random() * 3) + 's';
        c.appendChild(l);
      }
    }

    function createRunwayLines() {
      const c = document.getElementById('runway-lines');
      // Horizontale Perspektiv-Linien
      for (let i = 0; i < 12; i++) {
        const pct = (i / 12) * 100;
        const line = document.createElement('div');
        line.className = 'runway-line';
        line.style.top = pct + '%';
        // Breite wird breiter nach unten
        const w = 20 + (pct / 100) * 60;
        line.style.width = w + '%';
        line.style.height = '1px';
        line.style.left = (50 - w/2) + '%';
        line.style.background = `rgba(201, 169, 110, ${0.02 + (pct/100) * 0.04})`;
        c.appendChild(line);
      }
    }

    // ═══════════════════════════════════════════════════════
    //  SHOP & STATISTIK
    // ═══════════════════════════════════════════════════════
    function redirectToShop(url, avatarId, articleId) {
      trackStat(avatarId, articleId, 'redirect');
      window.open(url, '_blank', 'noopener');
    }

    function shopAll(event, avatarId) {
      event.preventDefault();
      event.stopPropagation();
      const avatar = catwalkData?.avatars.find(a => a.id === avatarId);
      if (!avatar) return;
      avatar.outfit.forEach((item, i) => {
        setTimeout(() => redirectToShop(item.product_url, avatarId, item.article_id), i * 300);
      });
    }

    async function trackStat(avatarId, articleId, action) {
      try {
        await fetch(API_BASE + '/catwalk/stats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ avatar_id: avatarId, article_id: articleId, action })
        });
      } catch (e) { /* silent */ }
    }

    // ═══════════════════════════════════════════════════════
    //  FULLSCREEN FASHION SHOW (wie echtes Fashion-Show-Video)
    // ═══════════════════════════════════════════════════════
    let fsShow = null;

    class FullScreenShow {
      constructor(avatars) {
        this.avatars = avatars;
        this.currentIndex = -1;
        this.activeSlot = 'a';           // Wechselt zwischen 'a' und 'b' für Crossfade
        this.advanceTimer = null;
        this.showDuration = 10000;       // 10 Sekunden pro Model
        this.isProductOpen = false;

        this.container = document.getElementById('fullscreen-show');
        this.videoA = document.getElementById('fs-video-a');
        this.videoB = document.getElementById('fs-video-b');
        this.image = document.getElementById('fs-image');
        this.overlay = document.getElementById('fs-overlay');
        this.modelName = document.getElementById('fs-model-name');
        this.modelBrands = document.getElementById('fs-model-brands');
        this.modelPrice = document.getElementById('fs-model-price');
        this.clickHint = document.getElementById('fs-click-hint');
        this.productPanel = document.getElementById('fs-product-panel');
        this.dotsContainer = document.getElementById('fs-dots');
        this.dimmer = document.getElementById('fs-dimmer');

        this.init();
      }

      init() {
        // Full-Screen-Modus aktivieren, Runway verstecken
        this.container.style.display = 'block';
        document.getElementById('avatar-track').style.display = 'none';
        // Runway-Elemente verstecken (der Video-Hintergrund IST der Laufsteg)
        document.querySelectorAll('.runway-floor, .runway-center-shine, .runway-lines, .audience, .runway-edge-lights, .spotlight, .flash-ambient').forEach(el => {
          el.style.display = 'none';
        });

        // Dots erstellen
        this.dotsContainer.innerHTML = '';
        this.avatars.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'fs-dot';
          dot.addEventListener('click', (e) => { e.stopPropagation(); this.showModel(i); });
          this.dotsContainer.appendChild(dot);
        });

        // Navigation
        document.getElementById('fs-prev').addEventListener('click', (e) => { e.stopPropagation(); this.prevModel(); });
        document.getElementById('fs-next').addEventListener('click', (e) => { e.stopPropagation(); this.nextModel(); });

        // Klick auf Video → Produkte zeigen / verstecken
        this.container.addEventListener('click', (e) => {
          if (e.target.closest('.fs-nav') || e.target.closest('.fs-dots') ||
              e.target.closest('.fs-product-panel') || e.target.closest('.controls') ||
              e.target.closest('.lang-wrapper')) return;

          if (this.isProductOpen) {
            this.closeProducts();
          } else {
            this.openProducts();
          }
        });

        // Dimmer klicken → Produkte schließen
        this.dimmer.addEventListener('click', (e) => { e.stopPropagation(); this.closeProducts(); });

        // Tastatur-Navigation
        this.keyHandler = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); this.nextModel(); }
          if (e.key === 'ArrowLeft') { e.preventDefault(); this.prevModel(); }
          if (e.key === 'Escape' && this.isProductOpen) { this.closeProducts(); }
        };
        document.addEventListener('keydown', this.keyHandler);

        // Touch-Swipe
        let touchStartX = 0;
        this.container.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        this.container.addEventListener('touchend', (e) => {
          const diff = touchStartX - e.changedTouches[0].clientX;
          if (Math.abs(diff) > 60) {
            diff > 0 ? this.nextModel() : this.prevModel();
          }
        });

        // Show starten
        this.showModel(0);
      }

      showModel(index) {
        if (index === this.currentIndex) return;

        const avatar = this.avatars[index];
        this.currentIndex = index;

        // Produkte schließen wenn offen
        if (this.isProductOpen) this.closeProducts();

        // Crossfade: eingehend / ausgehend bestimmen
        const incoming = this.activeSlot === 'a' ? this.videoB : this.videoA;
        const outgoing = this.activeSlot === 'a' ? this.videoA : this.videoB;
        this.activeSlot = this.activeSlot === 'a' ? 'b' : 'a';

        // Bild ausblenden
        this.image.classList.remove('active');
        this.image.style.display = 'none';

        if (avatar.generated_video) {
          // ★ VIDEO-MODUS: bildschirmfüllendes Fashion-Show-Video
          // Alte ended-Handler entfernen
          incoming.onended = null;
          outgoing.onended = null;
          incoming.src = avatar.generated_video;
          incoming.load();
          incoming.play().catch(() => {});
          incoming.classList.add('active');
          outgoing.classList.remove('active');
          // Altes Video nach Überblendung stoppen
          setTimeout(() => { outgoing.pause(); outgoing.removeAttribute('src'); outgoing.load(); }, 1500);
          // Wenn Video zu Ende → nächstes Model (kein loop, nur einmal abspielen)
          incoming.onended = () => { if (!isPaused) this.nextModel(); };

        } else if (avatar.generated_image) {
          // Bild-Modus mit Ken-Burns-Zoom
          outgoing.classList.remove('active');
          setTimeout(() => { outgoing.pause(); outgoing.removeAttribute('src'); outgoing.load(); }, 1500);
          incoming.classList.remove('active');

          this.image.src = avatar.generated_image;
          this.image.style.display = 'block';
          requestAnimationFrame(() => this.image.classList.add('active'));
        }

        // Overlay aktualisieren (mit verzögertem Einblenden)
        this.overlay.classList.remove('visible');
        setTimeout(() => {
          this.modelName.textContent = avatar.name;
          const brands = [...new Set(avatar.outfit.map(o => o.brand_name))];
          this.modelBrands.textContent = brands.length > 0 ? brands.join(' · ') : '';
          this.modelPrice.textContent = avatar.outfit.length > 0 ? formatPrice(avatar.total_price) : '';
          this.clickHint.textContent = t('clickHint');
          this.overlay.classList.add('visible');
        }, 500);

        // Dots aktualisieren
        this.dotsContainer.querySelectorAll('.fs-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });

        // Produkt-Panel bauen
        this.buildProductPanel(avatar);

        // Statistik
        trackStat(avatar.id, null, 'view');

        // Auto-Advance nur für Bild-Modus (Videos wechseln über onended)
        if (!avatar.generated_video) {
          this.scheduleAdvance();
        } else {
          // Timer stoppen falls von Bild-Model kommend
          if (this.advanceTimer) { clearTimeout(this.advanceTimer); this.advanceTimer = null; }
        }
      }

      buildProductPanel(avatar) {
        if (!avatar.outfit?.length) {
          this.productPanel.innerHTML = '';
          return;
        }

        const brands = [...new Set(avatar.outfit.map(o => o.brand_name))];
        const brandLabel = brands.length > 1 ? brands.join(' × ') : brands[0];

        const items = avatar.outfit.map(i => `
          <li class="product-item" data-url="${i.product_url}" data-avatar="${avatar.id}" data-article="${i.article_id}">
            <div class="product-item-info">
              <div class="product-item-category">${tCat(i.category)}</div>
              <div class="product-item-name">${i.article_name}</div>
              <div class="product-item-brand">${i.brand_name}</div>
            </div>
            <span class="product-item-price">${formatPrice(i.price)}</span>
            <span class="product-item-link">${t('shopLink')}</span>
          </li>`).join('');

        this.productPanel.innerHTML = `
          <div class="fs-panel-handle"></div>
          <div class="product-card-header">
            <span class="product-card-brand">${brandLabel}</span>
            <span class="product-card-total">${formatPrice(avatar.total_price)}</span>
          </div>
          <ul class="product-card-items">${items}</ul>
          <div class="free-shipping-badge">${t('freeShipping')}</div>
          <a class="shop-all-btn" href="#" id="fs-shop-all">${t('shopAll')}</a>
        `;

        // Shop-All-Button
        document.getElementById('fs-shop-all')?.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          this.shopAll(avatar.id);
        });

        // Produkt-Items klickbar
        this.productPanel.querySelectorAll('.product-item[data-url]').forEach(item => {
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            redirectToShop(item.dataset.url, item.dataset.avatar, item.dataset.article);
          });
        });
      }

      openProducts() {
        if (!this.avatars[this.currentIndex]?.outfit?.length) return;
        this.isProductOpen = true;
        this.productPanel.classList.add('open');
        this.dimmer.classList.add('active');

        // Video pausieren
        const activeVid = this.activeSlot === 'b' ? this.videoA : this.videoB;
        // Note: activeSlot was toggled, so current video is the opposite
        this.videoA.pause();
        this.videoB.pause();

        // Auto-Advance stoppen
        if (this.advanceTimer) { clearTimeout(this.advanceTimer); this.advanceTimer = null; }

        trackStat(this.avatars[this.currentIndex].id, null, 'click');
      }

      closeProducts() {
        this.isProductOpen = false;
        this.productPanel.classList.remove('open');
        this.dimmer.classList.remove('active');

        // Video weiterspielen
        const currentAvatar = this.avatars[this.currentIndex];
        if (currentAvatar?.generated_video) {
          const activeVid = this.activeSlot === 'a' ? this.videoA : this.videoB;
          activeVid.play().catch(() => {});
        }

        // Auto-Advance wieder starten (nur für Bild-Modus, Videos nutzen onended)
        if (!currentAvatar?.generated_video) {
          this.scheduleAdvance();
        }
      }

      nextModel() {
        const next = (this.currentIndex + 1) % this.avatars.length;
        this.showModel(next);
      }

      prevModel() {
        const prev = (this.currentIndex - 1 + this.avatars.length) % this.avatars.length;
        this.showModel(prev);
      }

      scheduleAdvance() {
        if (this.advanceTimer) clearTimeout(this.advanceTimer);
        if (isPaused) return;
        const duration = this.showDuration / speedMultiplier;
        this.advanceTimer = setTimeout(() => this.nextModel(), duration);
      }

      shopAll(avatarId) {
        const avatar = this.avatars.find(a => a.id === avatarId);
        if (!avatar) return;
        avatar.outfit.forEach((item, i) => {
          setTimeout(() => redirectToShop(item.product_url, avatarId, item.article_id), i * 300);
        });
      }

      destroy() {
        if (this.advanceTimer) clearTimeout(this.advanceTimer);
        this.videoA.pause(); this.videoA.removeAttribute('src'); this.videoA.load();
        this.videoB.pause(); this.videoB.removeAttribute('src'); this.videoB.load();
        this.videoA.classList.remove('active');
        this.videoB.classList.remove('active');
        this.image.classList.remove('active');
        this.container.style.display = 'none';
        this.dotsContainer.innerHTML = '';
        this.overlay.classList.remove('visible');
        this.productPanel.classList.remove('open');
        this.dimmer.classList.remove('active');
        if (this.keyHandler) document.removeEventListener('keydown', this.keyHandler);
        document.getElementById('avatar-track').style.display = 'block';
        document.querySelectorAll('.runway-floor, .runway-center-shine, .runway-lines, .audience, .runway-edge-lights, .spotlight, .flash-ambient').forEach(el => {
          el.style.display = '';
        });
      }
    }

    // ═══════════════════════════════════════════════════════
    //  CATWALK LADEN & RENDERN
    // ═══════════════════════════════════════════════════════
    async function loadCatwalkData() {
      try {
        const res = await fetch(API_BASE + '/catwalk/show');
        catwalkData = await res.json();
        return catwalkData;
      } catch (err) {
        console.error('Fehler:', err);
        return null;
      }
    }

    function renderCatwalk() {
      const track = document.getElementById('avatar-track');
      track.innerHTML = '';

      // Alte Shows stoppen
      if (fsShow) { fsShow.destroy(); fsShow = null; }
      activeWalkers = [];
      walkerQueue = [];
      if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
      lastFrameTime = 0;

      if (!catwalkData || catwalkData.avatars.length === 0) {
        track.innerHTML = `<div class="empty-state"><h2>${t('emptyTitle')}</h2><p>${t('emptyText')} <a href="/admin">${t('emptyLink')}</a></p></div>`;
        document.getElementById('avatar-counter').textContent = '';
        return;
      }

      // UI aktualisieren
      document.getElementById('catwalk-title').textContent = catwalkData.config?.title || t('title');
      document.getElementById('catwalk-subtitle').textContent = t('subtitle');
      document.getElementById('date-display').textContent = formatDate(catwalkData.date);
      document.getElementById('avatar-counter').innerHTML = `<span>${catwalkData.avatars.length}</span> ${t('models')}`;

      if (catwalkData.config?.background_color) {
        document.documentElement.style.setProperty('--bg-dark', catwalkData.config.background_color);
      }

      // ★ ENTSCHEIDUNG: Videos vorhanden → Full-Screen Fashion Show
      //   Keine Videos → Runway-Modus (SVG-Silhouetten)
      const hasVideos = catwalkData.avatars.some(a => a.generated_video);

      if (hasVideos) {
        // ════════════════════════════════════════════
        //  FULLSCREEN FASHION SHOW MODE
        //  Videos bildschirmfüllend, wie echte Show
        // ════════════════════════════════════════════
        console.log('🎬 Fullscreen Fashion Show Modus (Videos vorhanden)');
        fsShow = new FullScreenShow(catwalkData.avatars);
      } else {
        // ════════════════════════════════════════════
        //  RUNWAY MODUS (Fallback: SVG-Silhouetten)
        // ════════════════════════════════════════════
        console.log('👗 Runway Modus (keine Videos — SVG-Avatare)');
        renderRunwayMode();
      }
    }

    // Runway-Modus: SVG-Avatare laufen über den CSS-Laufsteg
    function renderRunwayMode() {
      const track = document.getElementById('avatar-track');

      catwalkData.avatars.forEach((avatar, index) => {
        const el = createAvatarElement(avatar, index);
        el.style.opacity = '0';
        track.appendChild(el);

        const walker = new WalkingAvatar(avatar, el, index);
        activeWalkers.push(walker);
        walkerQueue.push(walker);

        el.querySelectorAll('.product-item[data-url]').forEach(item => {
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            redirectToShop(item.dataset.url, item.dataset.avatar, item.dataset.article);
          });
        });
      });

      animFrameId = requestAnimationFrame(animationLoop);
      spawnNextAvatar();
    }

    // ═══════════════════════════════════════════════════════
    //  CONTROLS
    // ═══════════════════════════════════════════════════════
    function updateLangUI() {
      document.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('active', o.dataset.lang === currentLang));
      document.getElementById('btn-lang').textContent = I18N[currentLang]?.flag || '🌐';
    }
    updateLangUI();

    document.getElementById('btn-lang').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('lang-wrapper').classList.toggle('open');
    });

    document.querySelectorAll('.lang-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        currentLang = opt.dataset.lang;
        localStorage.setItem('catwalk-lang', currentLang);
        document.getElementById('lang-wrapper').classList.remove('open');
        updateLangUI();
        renderCatwalk();
      });
    });

    document.addEventListener('click', () => {
      document.getElementById('lang-wrapper').classList.remove('open');
      // Gestoppte Avatare weiterlaufen lassen bei Klick auf die Bühne
      activeWalkers.filter(w => w.state === 'stopped').forEach(w => w.resume());
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('btn-pause').classList.toggle('active', isPaused);
    });

    document.getElementById('btn-speed').addEventListener('click', () => {
      const speeds = [0.5, 1, 1.5, 2];
      const idx = speeds.indexOf(speedMultiplier);
      speedMultiplier = speeds[(idx + 1) % speeds.length];
      document.getElementById('btn-speed').textContent = speedMultiplier === 1 ? '⚡' : `${speedMultiplier}×`;
    });

    document.getElementById('btn-flash').addEventListener('click', () => {
      flashesEnabled = !flashesEnabled;
      document.getElementById('btn-flash').classList.toggle('active', flashesEnabled);
      flashesEnabled ? startFlashes() : stopFlashes();
    });
    document.getElementById('btn-flash').classList.add('active');

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      document.fullscreenElement ? document.exitFullscreen() : document.getElementById('catwalk-scene').requestFullscreen();
    });

    // ═══════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════
    async function init() {
      const bar = document.getElementById('loading-bar-fill');
      bar.style.width = '30%';

      createParticles();
      createEdgeLights();
      createRunwayLines();
      bar.style.width = '50%';

      await loadCatwalkData();
      bar.style.width = '80%';

      renderCatwalk();
      startFlashes();
      bar.style.width = '100%';

      setTimeout(() => {
        document.getElementById('loading').classList.add('fade-out');
        setTimeout(() => document.getElementById('loading').remove(), 800);
      }, 500);

      // Auto-Refresh alle 5 Minuten
      setInterval(async () => {
        await loadCatwalkData();
        renderCatwalk();
      }, 5 * 60 * 1000);
    }

    init();
  </script>
