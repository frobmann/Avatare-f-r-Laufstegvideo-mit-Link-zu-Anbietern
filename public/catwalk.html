<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Catwalk – Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark: #0a0a14;
      --runway-color: #1a1a2e;
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.3);
      --text-primary: #f0ece2;
      --text-secondary: #8a8a9a;
      --card-bg: rgba(20, 20, 35, 0.95);
      --card-border: rgba(201, 169, 110, 0.2);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: default;
    }

    /* Catwalk Scene */
    #catwalk-scene {
      position: relative;
      width: 100%;
      height: 100vh;
      perspective: 1200px;
      overflow: hidden;
    }

    /* Background Gradient & Lights */
    .stage-background {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(201, 169, 110, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 100%, rgba(80, 40, 120, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(40, 80, 120, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a14 0%, #12122a 50%, #0a0a14 100%);
    }

    /* Spotlight Effects */
    .spotlight {
      position: absolute;
      width: 300px;
      height: 100%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        transparent 100%);
      top: 0;
      animation: spotlightSway 8s ease-in-out infinite;
    }
    .spotlight:nth-child(1) { left: 15%; animation-delay: 0s; }
    .spotlight:nth-child(2) { left: 50%; animation-delay: -3s; }
    .spotlight:nth-child(3) { left: 75%; animation-delay: -6s; }

    @keyframes spotlightSway {
      0%, 100% { transform: skewX(-5deg); opacity: 0.5; }
      50% { transform: skewX(5deg); opacity: 1; }
    }

    /* Runway */
    .runway {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 40%;
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgba(30, 30, 50, 0.5) 20%,
          rgba(30, 30, 50, 0.8) 100%);
    }

    .runway-floor {
      position: absolute;
      bottom: 0;
      left: 10%;
      width: 80%;
      height: 60%;
      background:
        linear-gradient(180deg,
          rgba(50, 50, 80, 0.3) 0%,
          rgba(30, 30, 55, 0.6) 100%);
      transform: perspective(600px) rotateX(45deg);
      transform-origin: bottom center;
      border-top: 1px solid rgba(201, 169, 110, 0.15);
    }

    .runway-center-line {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 2px;
      height: 60%;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(201, 169, 110, 0.1) 30%,
        rgba(201, 169, 110, 0.2) 100%);
      transform: perspective(600px) rotateX(45deg) translateX(-50%);
      transform-origin: bottom center;
    }

    /* Title */
    .catwalk-title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      z-index: 10;
    }

    .catwalk-subtitle {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-secondary);
      z-index: 10;
    }

    /* Avatar Container */
    .avatar-track {
      position: absolute;
      bottom: 8%;
      left: 0;
      width: 100%;
      height: 70%;
      pointer-events: none;
    }

    .avatar-wrapper {
      position: absolute;
      bottom: 0;
      pointer-events: all;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.05);
    }

    .avatar-figure {
      position: relative;
      width: 120px;
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Avatar Silhouette (CSS-generiert) */
    .avatar-silhouette {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .avatar-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 42px;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(135deg, #d4a77a, #c49066);
    }

    .avatar-hair {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 26px;
      border-radius: 50% 50% 0 0;
    }

    .avatar-neck {
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 12px;
      background: linear-gradient(135deg, #d4a77a, #c49066);
    }

    .avatar-torso {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 90px;
      border-radius: 8px 8px 4px 4px;
    }

    .avatar-arm-left, .avatar-arm-right {
      position: absolute;
      top: 55px;
      width: 18px;
      height: 75px;
      border-radius: 8px;
    }
    .avatar-arm-left { left: 12px; transform: rotate(5deg); }
    .avatar-arm-right { right: 12px; transform: rotate(-5deg); }

    .avatar-legs {
      position: absolute;
      top: 135px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 130px;
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .avatar-leg {
      width: 22px;
      height: 100%;
      border-radius: 4px 4px 6px 6px;
    }

    .avatar-shoes {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .avatar-shoe {
      width: 26px;
      height: 14px;
      border-radius: 4px 12px 4px 4px;
    }

    /* Avatar Shadow */
    .avatar-shadow {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 16px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
    }

    /* Walk Animation */
    .avatar-walk {
      animation: avatarWalk var(--walk-duration, 20s) linear infinite;
    }

    @keyframes avatarWalk {
      0% { left: 110%; }
      100% { left: -15%; }
    }

    /* Walking leg motion */
    .walking .avatar-leg:first-child {
      animation: legSwing 0.6s ease-in-out infinite alternate;
    }
    .walking .avatar-leg:last-child {
      animation: legSwing 0.6s ease-in-out infinite alternate-reverse;
    }
    .walking .avatar-arm-left {
      animation: armSwing 0.6s ease-in-out infinite alternate;
    }
    .walking .avatar-arm-right {
      animation: armSwing 0.6s ease-in-out infinite alternate-reverse;
    }

    @keyframes legSwing {
      0% { transform: rotate(-8deg); transform-origin: top center; }
      100% { transform: rotate(8deg); transform-origin: top center; }
    }
    @keyframes armSwing {
      0% { transform: rotate(8deg); transform-origin: top center; }
      100% { transform: rotate(-5deg); transform-origin: top center; }
    }

    /* Avatar Name Label */
    .avatar-name {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .avatar-wrapper:hover .avatar-name {
      opacity: 1;
    }

    /* Product Info Card (erscheint bei Hover/Click) */
    .product-card {
      position: absolute;
      bottom: calc(100% + 20px);
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      width: 280px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
      z-index: 100;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .avatar-wrapper:hover .product-card,
    .avatar-wrapper.active .product-card {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: all;
    }

    .product-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(201, 169, 110, 0.1);
    }

    .product-card-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .product-card-total {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .product-card-items {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
    }

    .product-card-items::-webkit-scrollbar {
      width: 4px;
    }
    .product-card-items::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 2px;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 6px;
      padding: 8px 6px;
    }

    .product-item:hover {
      background: rgba(201, 169, 110, 0.08);
    }

    .product-item-info {
      flex: 1;
    }

    .product-item-category {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
    }

    .product-item-name {
      font-size: 0.85rem;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .product-item-brand {
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0.7;
    }

    .product-item-price {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-left: 12px;
      white-space: nowrap;
    }

    .product-item-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .product-item:hover .product-item-link {
      opacity: 1;
    }

    /* Shop Now Button */
    .shop-all-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), #a88a50);
      color: #0a0a14;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
    }

    .shop-all-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Loading State */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      z-index: 1000;
      transition: opacity 0.8s ease;
    }

    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent);
      letter-spacing: 0.3em;
      margin-bottom: 30px;
    }

    .loading-bar {
      width: 200px;
      height: 2px;
      background: rgba(201, 169, 110, 0.2);
      border-radius: 1px;
      overflow: hidden;
    }

    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.5s ease;
    }

    /* Empty State */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    .empty-state h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .empty-state a {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Particle effects */
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(201, 169, 110, 0.3);
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20px) rotate(720deg); opacity: 0; }
    }

    /* Date Display */
    .date-display {
      position: absolute;
      top: 30px;
      right: 30px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      z-index: 10;
    }

    /* Controls */
    .controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .control-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(201, 169, 110, 0.15);
      border-color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .catwalk-title { font-size: 1.5rem; top: 15px; }
      .catwalk-subtitle { font-size: 0.7rem; top: 55px; }
      .avatar-figure { width: 80px; height: 220px; }
      .avatar-head { width: 26px; height: 30px; }
      .avatar-hair { width: 32px; height: 18px; }
      .avatar-torso { width: 44px; height: 65px; }
      .avatar-arm-left, .avatar-arm-right { width: 14px; height: 55px; }
      .avatar-legs { height: 95px; top: 110px; }
      .avatar-leg { width: 18px; }
      .product-card { width: 240px; padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading" class="loading-screen">
    <div class="loading-text">FASHION CATWALK</div>
    <div class="loading-bar">
      <div id="loading-bar-fill" class="loading-bar-fill"></div>
    </div>
  </div>

  <!-- Catwalk Scene -->
  <div id="catwalk-scene">
    <div class="stage-background"></div>
    <div class="spotlight"></div>
    <div class="spotlight"></div>
    <div class="spotlight"></div>

    <div class="runway">
      <div class="runway-floor"></div>
      <div class="runway-center-line"></div>
    </div>

    <div class="catwalk-title" id="catwalk-title">Fashion Catwalk</div>
    <div class="catwalk-subtitle">Klicke auf die Models – Shoppe den Look</div>

    <div class="date-display" id="date-display"></div>

    <div class="avatar-track" id="avatar-track">
      <!-- Avatare werden hier dynamisch eingefügt -->
    </div>

    <div class="controls">
      <button class="control-btn" id="btn-pause" title="Pause/Play">⏯</button>
      <button class="control-btn" id="btn-speed" title="Geschwindigkeit">⚡</button>
      <button class="control-btn" id="btn-fullscreen" title="Vollbild">⛶</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api';
    let catwalkData = null;
    let isPaused = false;
    let speedMultiplier = 1;
    const CATEGORY_LABELS = {
      'kopfbedeckung': 'Kopfbedeckung',
      'oberteil': 'Oberteil',
      'jacke': 'Jacke',
      'hose': 'Hose',
      'rock': 'Rock',
      'kleid': 'Kleid',
      'schuhe': 'Schuhe',
      'accessoire': 'Accessoire',
      'tasche': 'Tasche',
      'schmuck': 'Schmuck'
    };

    // Farbpaletten für Avatare
    const AVATAR_PALETTES = [
      { hair: '#2c1810', top: '#c9a96e', bottom: '#1a1a2e', shoes: '#0a0a14', accent: '#e8d5b0' },
      { hair: '#4a3728', top: '#8b4557', bottom: '#2c2c3a', shoes: '#1a1a1a', accent: '#d4869a' },
      { hair: '#1a1a2e', top: '#4a7c6f', bottom: '#f5f0e8', shoes: '#c9a96e', accent: '#7ab5a3' },
      { hair: '#8b6914', top: '#2c3e6b', bottom: '#1a1a2e', shoes: '#8b4557', accent: '#5a7ab5' },
      { hair: '#d4a77a', top: '#f5f0e8', bottom: '#c9a96e', shoes: '#2c1810', accent: '#e8d5b0' },
      { hair: '#1a0a0a', top: '#e74c3c', bottom: '#0a0a14', shoes: '#c9a96e', accent: '#ff6b6b' },
      { hair: '#6b4423', top: '#9b59b6', bottom: '#2c2c3a', shoes: '#1a1a1a', accent: '#c39bd3' },
      { hair: '#2c3e50', top: '#f39c12', bottom: '#1a1a2e', shoes: '#2c1810', accent: '#f5b041' },
    ];

    // Datum formatieren
    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('de-CH', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    // Particles erzeugen
    function createParticles() {
      const scene = document.getElementById('catwalk-scene');
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (8 + Math.random() * 12) + 's';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.width = (1 + Math.random() * 2) + 'px';
        particle.style.height = particle.style.width;
        scene.appendChild(particle);
      }
    }

    // Avatar-HTML generieren
    function createAvatarElement(avatar, index) {
      const palette = AVATAR_PALETTES[index % AVATAR_PALETTES.length];
      const walkDuration = (18 + Math.random() * 8) / speedMultiplier;
      const startDelay = index * (walkDuration / (catwalkData.avatars.length || 1)) * 0.6;

      const wrapper = document.createElement('div');
      wrapper.className = 'avatar-wrapper avatar-walk walking';
      wrapper.style.setProperty('--walk-duration', walkDuration + 's');
      wrapper.style.animationDelay = `-${startDelay}s`;
      wrapper.dataset.avatarId = avatar.id;

      // Outfit items für Farben verwenden wenn vorhanden
      const topColor = getOutfitColor(avatar.outfit, 'oberteil') || getOutfitColor(avatar.outfit, 'kleid') || palette.top;
      const bottomColor = getOutfitColor(avatar.outfit, 'hose') || getOutfitColor(avatar.outfit, 'rock') || palette.bottom;
      const shoeColor = getOutfitColor(avatar.outfit, 'schuhe') || palette.shoes;
      const jacketColor = getOutfitColor(avatar.outfit, 'jacke');

      wrapper.innerHTML = `
        <div class="avatar-figure">
          <div class="avatar-silhouette">
            <div class="avatar-hair" style="background: ${palette.hair}"></div>
            <div class="avatar-head"></div>
            <div class="avatar-neck"></div>
            <div class="avatar-torso" style="background: linear-gradient(135deg, ${topColor}, ${adjustColor(topColor, -20)})"></div>
            <div class="avatar-arm-left" style="background: ${jacketColor || topColor}"></div>
            <div class="avatar-arm-right" style="background: ${jacketColor || topColor}"></div>
            <div class="avatar-legs">
              <div class="avatar-leg" style="background: linear-gradient(180deg, ${bottomColor}, ${adjustColor(bottomColor, -15)})"></div>
              <div class="avatar-leg" style="background: linear-gradient(180deg, ${bottomColor}, ${adjustColor(bottomColor, -15)})"></div>
            </div>
            <div class="avatar-shoes">
              <div class="avatar-shoe" style="background: ${shoeColor}"></div>
              <div class="avatar-shoe" style="background: ${shoeColor}"></div>
            </div>
          </div>
          <div class="avatar-shadow"></div>
          <div class="avatar-name">${avatar.name}</div>
        </div>
        ${createProductCard(avatar)}
      `;

      // Click handler
      wrapper.addEventListener('click', (e) => {
        e.stopPropagation();
        // Toggle active state
        document.querySelectorAll('.avatar-wrapper.active').forEach(el => {
          if (el !== wrapper) el.classList.remove('active');
        });
        wrapper.classList.toggle('active');

        // Track hover stat
        trackStat(avatar.id, null, 'click');
      });

      // Hover stat
      wrapper.addEventListener('mouseenter', () => {
        trackStat(avatar.id, null, 'hover');
      });

      return wrapper;
    }

    // Outfit-Farbe für Kategorie ermitteln
    function getOutfitColor(outfit, category) {
      const item = outfit.find(o => o.category === category);
      return item && item.color ? item.color : null;
    }

    // Farbe anpassen (heller/dunkler)
    function adjustColor(hex, amount) {
      if (!hex || !hex.startsWith('#')) return hex;
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
      const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
      return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // Produkt-Karte erstellen
    function createProductCard(avatar) {
      if (!avatar.outfit || avatar.outfit.length === 0) {
        return '';
      }

      // Brands sammeln
      const brands = [...new Set(avatar.outfit.map(o => o.brand_name))];
      const brandLabel = brands.length > 1 ? brands.join(' × ') : brands[0];

      let itemsHtml = avatar.outfit.map(item => `
        <li class="product-item" data-url="${item.product_url}" data-avatar="${avatar.id}" data-article="${item.article_id}">
          <div class="product-item-info">
            <div class="product-item-category">${CATEGORY_LABELS[item.category] || item.category}</div>
            <div class="product-item-name">${item.article_name}</div>
            <div class="product-item-brand">${item.brand_name}</div>
          </div>
          <span class="product-item-price">${item.currency} ${item.price.toFixed(2)}</span>
          <span class="product-item-link">Shop →</span>
        </li>
      `).join('');

      return `
        <div class="product-card">
          <div class="product-card-header">
            <span class="product-card-brand">${brandLabel}</span>
            <span class="product-card-total">${avatar.currency} ${avatar.total_price.toFixed(2)}</span>
          </div>
          <ul class="product-card-items">${itemsHtml}</ul>
          <a class="shop-all-btn" href="#" onclick="shopAll(event, '${avatar.id}')">
            Ganzen Look shoppen →
          </a>
        </div>
      `;
    }

    // Zum Shop weiterleiten
    function redirectToShop(url, avatarId, articleId) {
      trackStat(avatarId, articleId, 'redirect');
      window.open(url, '_blank', 'noopener');
    }

    // Ganzen Look shoppen – öffnet alle Artikel
    function shopAll(event, avatarId) {
      event.preventDefault();
      event.stopPropagation();
      const avatar = catwalkData.avatars.find(a => a.id === avatarId);
      if (!avatar) return;

      avatar.outfit.forEach((item, i) => {
        setTimeout(() => {
          redirectToShop(item.product_url, avatarId, item.article_id);
        }, i * 300);
      });
    }

    // Statistik tracken
    async function trackStat(avatarId, articleId, action) {
      try {
        await fetch(API_BASE + '/catwalk/stats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ avatar_id: avatarId, article_id: articleId, action })
        });
      } catch (e) { /* silent */ }
    }

    // Catwalk-Daten laden
    async function loadCatwalkData() {
      try {
        const res = await fetch(API_BASE + '/catwalk/show');
        catwalkData = await res.json();
        return catwalkData;
      } catch (err) {
        console.error('Fehler beim Laden:', err);
        return null;
      }
    }

    // Catwalk rendern
    function renderCatwalk() {
      const track = document.getElementById('avatar-track');
      track.innerHTML = '';

      if (!catwalkData || catwalkData.avatars.length === 0) {
        track.innerHTML = `
          <div class="empty-state">
            <h2>Noch keine Avatare</h2>
            <p>Erstelle Avatare im <a href="/admin">Admin Dashboard</a></p>
          </div>
        `;
        return;
      }

      // Config anwenden
      if (catwalkData.config) {
        document.getElementById('catwalk-title').textContent = catwalkData.config.title || 'Fashion Catwalk';
        if (catwalkData.config.background_color) {
          document.documentElement.style.setProperty('--bg-dark', catwalkData.config.background_color);
        }
      }

      // Datum anzeigen
      document.getElementById('date-display').textContent = formatDate(catwalkData.date);

      // Avatare erstellen
      catwalkData.avatars.forEach((avatar, index) => {
        const el = createAvatarElement(avatar, index);
        track.appendChild(el);
      });

      // Klick-Handler für Produkt-Items
      document.querySelectorAll('.product-item[data-url]').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          redirectToShop(item.dataset.url, item.dataset.avatar, item.dataset.article);
        });
      });
    }

    // Controls
    document.getElementById('btn-pause').addEventListener('click', () => {
      isPaused = !isPaused;
      document.querySelectorAll('.avatar-walk').forEach(el => {
        el.style.animationPlayState = isPaused ? 'paused' : 'running';
      });
    });

    document.getElementById('btn-speed').addEventListener('click', () => {
      const speeds = [0.5, 1, 1.5, 2];
      const currentIdx = speeds.indexOf(speedMultiplier);
      speedMultiplier = speeds[(currentIdx + 1) % speeds.length];
      document.querySelectorAll('.avatar-walk').forEach(el => {
        const currentDuration = parseFloat(el.style.getPropertyValue('--walk-duration'));
        el.style.setProperty('--walk-duration', (currentDuration / speedMultiplier) + 's');
      });
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.getElementById('catwalk-scene').requestFullscreen();
      }
    });

    // Klick auf Szene schließt aktive Karten
    document.getElementById('catwalk-scene').addEventListener('click', () => {
      document.querySelectorAll('.avatar-wrapper.active').forEach(el => {
        el.classList.remove('active');
      });
    });

    // Initialisierung
    async function init() {
      const loadingBar = document.getElementById('loading-bar-fill');
      loadingBar.style.width = '30%';

      createParticles();
      loadingBar.style.width = '50%';

      await loadCatwalkData();
      loadingBar.style.width = '80%';

      renderCatwalk();
      loadingBar.style.width = '100%';

      // Loading ausblenden
      setTimeout(() => {
        document.getElementById('loading').classList.add('fade-out');
        setTimeout(() => {
          document.getElementById('loading').remove();
        }, 800);
      }, 500);

      // Auto-Refresh alle 5 Minuten
      setInterval(async () => {
        await loadCatwalkData();
        renderCatwalk();
      }, 5 * 60 * 1000);
    }

    init();
  </script>
</body>
</html>
